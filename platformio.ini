[platformio]
boards_dir = boards
src_dir = src

[env]
; Arduino core 3.x via the community "pioarduino" fork. The official
; espressif32 platform is frozen at Arduino core 2.0.17.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-std=gnu++17
build_unflags = -std=gnu++11

; RejsaCAN-ESP32-S3 v3.x — ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB OPI PSRAM).
; https://github.com/MagnusThome/RejsaCAN-ESP32
[env:rejsacan]
board = esp32s3_flash_16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DBOARD_REJSACAN -DBOARD_HAS_PSRAM

; Bus test build: TWAI in listen-only mode, prints frame and error counts
; over USB serial. See tools/bus_test_notes.md.
[env:rejsacan_bustest]
board = esp32s3_flash_16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DBOARD_REJSACAN -DBOARD_HAS_PSRAM -DBUS_TEST_ONLY

; WiFi build: env:rejsacan plus a TCP listener on port 35000. The board runs its
; own WPA2 access point (SSID RejsaElm) and answers at 192.168.4.1 — the
; ELM327-over-WiFi convention every desktop tool already speaks. BLE stays on:
; both links feed one session and the first client to connect holds it, see
; link/session_owner.h.
; Kept a separate env rather than folded into env:rejsacan because the WiFi
; stack costs ~205 kB of flash, ~11 kB of RAM and real current draw even idle —
; without -DWIFI_LINK the linker drops all of it.
; Change the password before flashing: it is the only thing between a passer-by
; and the CAN bus.
[env:rejsacan_wifi]
board = esp32s3_flash_16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DBOARD_REJSACAN -DBOARD_HAS_PSRAM -DWIFI_LINK
	'-DWIFI_LINK_PASSWORD="rejsacan"'

; Host-side unit tests for the pure-logic units (elm327/, isotp/).
; These never touch hardware and run on the development machine.
[env:native]
platform = native
framework =
test_framework = unity
build_flags = -std=gnu++17 -DNATIVE_TEST -I src
test_build_src = yes
; An EXCLUDE list, deliberately: everything under src/ is host-compiled unless
; it is named here, so a new pure-logic file is covered by the tests the moment
; it is added. An allowlist would silently leave it out of the host build and
; the omission would look exactly like passing tests.
; Excluded because they cannot compile on the host:
;   main.cpp             — Arduino entry points
;   can/                 — the TWAI driver
;   link/                — the Arduino BLE stack
;   elm327/session.cpp   — pulls in Arduino.h and the TWAI driver via can_bus.h
;                          (its pure logic lives in elm327/hexline.cpp, which IS
;                          host-built and tested)
build_src_filter = +<*> -<main.cpp> -<can/> -<link/> -<elm327/session.cpp>

; DID scan build: the ELM327 session over USB CDC serial instead of BLE, with
; negative-response codes reported rather than collapsed into NO DATA. Driven by
; tools/did_scan.py. BLE is deliberately not started — see link/serial_link.h.
; Read-only: the session can still only send what a client asks for, and
; did_scan.py sends nothing but service 22.
[env:rejsacan_usbscan]
board = esp32s3_flash_16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DBOARD_REJSACAN -DBOARD_HAS_PSRAM -DUSB_SERIAL_LINK -DREPORT_NRC
